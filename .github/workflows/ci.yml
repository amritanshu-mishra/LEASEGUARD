name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    name: Backend tests (with domain coverage gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: bash scripts/install_backend.sh
      - name: Compile check
        run: python -m compileall backend/app -q
      - name: Run tests
        working-directory: backend
        env:
          PYTHONPATH: .
        run: |
          pytest -q --cov=app.domain --cov=app.services \
                 --cov-report=term-missing --cov-fail-under=90

  frontend:
    name: Frontend type-check, build and UI end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # The E2E harness starts the real backend, so it needs Python as well.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # The E2E job starts the app, so it needs the backend dependencies. The
      # script also guarantees a working cv2 (see its header) and fails loudly
      # if OCR would be broken at runtime rather than leaving it to a tenant.
      - name: Install backend dependencies
        run: bash scripts/install_backend.sh

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # Builds the bundle, starts uvicorn on a throwaway database, drives the
      # built SPA with jsdom, and fails on any assertion, HTTP error, uncaught JS
      # error, or failed build. This is the step that catches "the button no
      # longer does anything" - the type-checker cannot.
      - name: UI end-to-end smoke test
        working-directory: frontend
        env:
          E2E_PORT: "8123"
        run: npm run e2e:ci
